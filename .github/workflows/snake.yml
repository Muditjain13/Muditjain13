name: Generate contribution snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d9694f&color_dots=#e7e7ea,#f2c463,#6fcf9f,#5980a6,#8a6fc4
            dist/github-snake-dark.svg?color_snake=#f08d74&color_dots=#21262d,#f2c463,#6fcf9f,#94bce3,#b39cf0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
